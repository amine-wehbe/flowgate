services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
  
  api:
    build: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "3000:3000"
    depends_on:
      - db
  proxy:
    build: ./proxy
    environment:
      API_URL: http://api:3000
      MKCERT_CAROOT: /certs
    volumes:
      - ${MKCERT_CAROOT}:/certs:ro
    ports:
      - "8080:8080"
    depends_on:
      - api
  frontend:
    build: ./frontend
    ports:
      - "4000:80"
    depends_on:
      - api

volumes:
  postgres-data:
